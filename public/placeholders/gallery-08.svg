<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#151515"/>
      <stop offset="70%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#040404"/>
    </radialGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B3122D" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(237, 232, 223, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Subtle corner ambient glow -->
  <circle cx="10%" cy="10%" r="200" fill="url(#glowGrad)"/>
  <circle cx="90%" cy="90%" r="220" fill="url(#glowGrad)"/>

  <!-- Border & Frame -->
  <rect x="16" y="16" width="768" height="768" fill="none" stroke="rgba(237, 232, 223, 0.12)" stroke-width="1"/>
  <rect x="22" y="22" width="756" height="756" fill="none" stroke="#B3122D" stroke-width="0.75" stroke-dasharray="6 8" opacity="0.4"/>

  <!-- Corner corner ticks -->
  <path d="M 16 36 L 16 16 L 36 16" fill="none" stroke="#B3122D" stroke-width="2"/>
  <path d="M 784 36 L 784 16 L 764 16" fill="none" stroke="#B3122D" stroke-width="2"/>
  <path d="M 16 764 L 16 784 L 36 784" fill="none" stroke="#B3122D" stroke-width="2"/>
  <path d="M 784 764 L 784 784 L 764 784" fill="none" stroke="#B3122D" stroke-width="2"/>

  <!-- Center Symbol Art -->
  
      <g opacity="0.45" stroke="#EDE8DF" stroke-width="1.2" fill="none">
        <polygon points="400,280 500,450 300,450" stroke="#B3122D" stroke-width="1.5" />
        <polygon points="400,520 500,350 300,350" stroke="#EDE8DF" stroke-width="1" />
        <circle cx="400" cy="400" r="50" stroke="#B3122D" stroke-dasharray="4 4" />
        <circle cx="400" cy="400" r="10" fill="#B3122D" />
      </g>
    

  <!-- Studio Emblem Top -->
  <g transform="translate(400, 54)">
    <text text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="10" letter-spacing="4" fill="#EDE8DF" opacity="0.4">
      MAD MONK TATTOO • STUDIO ARCHIVE
    </text>
  </g>

  <!-- Bottom Labels -->
  <g transform="translate(400, 725)">
    <rect x="-110" y="-18" width="220" height="24" rx="2" fill="#0A0A0A" stroke="#B3122D" stroke-width="1" opacity="0.8"/>
    <text text-anchor="middle" y="-2" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#B3122D">
      TATTOO 08 // MINIMAL
    </text>
    <text text-anchor="middle" y="24" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="15" font-weight="600" letter-spacing="2" fill="#EDE8DF">
      SOLAR SIGIL
    </text>
    <text text-anchor="middle" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="9" letter-spacing="1.5" fill="#9E9A90">
      CUSTOM BESPOKE INK
    </text>
  </g>
</svg>