<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 950" width="700" height="950">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#151515"/>
      <stop offset="70%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#040404"/>
    </radialGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B3122D" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(237, 232, 223, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Subtle corner ambient glow -->
  <circle cx="10%" cy="10%" r="200" fill="url(#glowGrad)"/>
  <circle cx="90%" cy="90%" r="220" fill="url(#glowGrad)"/>

  <!-- Border & Frame -->
  <rect x="16" y="16" width="668" height="918" fill="none" stroke="rgba(237, 232, 223, 0.12)" stroke-width="1"/>
  <rect x="22" y="22" width="656" height="906" fill="none" stroke="#B3122D" stroke-width="0.75" stroke-dasharray="6 8" opacity="0.4"/>

  <!-- Corner corner ticks -->
  <path d="M 16 36 L 16 16 L 36 16" fill="none" stroke="#B3122D" stroke-width="2"/>
  <path d="M 684 36 L 684 16 L 664 16" fill="none" stroke="#B3122D" stroke-width="2"/>
  <path d="M 16 914 L 16 934 L 36 934" fill="none" stroke="#B3122D" stroke-width="2"/>
  <path d="M 684 914 L 684 934 L 664 934" fill="none" stroke="#B3122D" stroke-width="2"/>

  <!-- Center Symbol Art -->
  
      <g stroke="#B3122D" stroke-width="1.2" opacity="0.45" fill="none">
        <circle cx="350" cy="475" r="140" stroke-dasharray="4 4" />
        <circle cx="350" cy="475" r="110" />
        <circle cx="350" cy="475" r="75" stroke-dasharray="8 6" />
        <circle cx="350" cy="475" r="40" />
        <circle cx="350" cy="475" r="12" fill="#B3122D" opacity="0.8" />
        <path d="M190 475 L510 475" />
        <path d="M350 315 L350 635" />
        <path d="M240 365 L460 585" stroke-dasharray="2 4" />
        <path d="M240 585 L460 365" stroke-dasharray="2 4" />
        <polygon points="350,380 445,475 350,570 255,475" />
        <polygon points="350,410 415,475 350,540 285,475" stroke-dasharray="3 3"/>
      </g>
    

  <!-- Studio Emblem Top -->
  <g transform="translate(350, 54)">
    <text text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="10" letter-spacing="4" fill="#EDE8DF" opacity="0.4">
      MAD MONK TATTOO • STUDIO ARCHIVE
    </text>
  </g>

  <!-- Bottom Labels -->
  <g transform="translate(350, 875)">
    <rect x="-110" y="-18" width="220" height="24" rx="2" fill="#0A0A0A" stroke="#B3122D" stroke-width="1" opacity="0.8"/>
    <text text-anchor="middle" y="-2" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#B3122D">
      TATTOO 01 // GEOMETRIC
    </text>
    <text text-anchor="middle" y="24" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="15" font-weight="600" letter-spacing="2" fill="#EDE8DF">
      SACRED MANDALA SLEEVE
    </text>
    <text text-anchor="middle" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="9" letter-spacing="1.5" fill="#9E9A90">
      CUSTOM BESPOKE INK
    </text>
  </g>
</svg>